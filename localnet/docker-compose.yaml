services:
  orderer-base:
    image: hyperledger/fabric-orderer:2.5.0
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      # Add TLS configuration
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      # Add cluster TLS configuration
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    command: orderer
    networks:
      - fabric-network

  peer-base:
    image: hyperledger/fabric-peer:2.5.0
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=localnet_fabric-network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
    command: peer node start
    networks:
      - fabric-network

  orderer0:
    extends:
      service: orderer-base
    container_name: orderer0.classicschain.com
    environment:
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:17050
    volumes:
      - ./.channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./.crypto-config/ordererOrganizations/classicschain.com/orderers/orderer0.classicschain.com/msp:/var/hyperledger/orderer/msp
      - ./.crypto-config/ordererOrganizations/classicschain.com/orderers/orderer0.classicschain.com/tls:/var/hyperledger/orderer/tls
      - orderer0.classicschain.com:/var/hyperledger/production/orderer
    ports:
      - 7050:7050
      - 17050:17050

  orderer1:
    extends:
      service: orderer-base
    container_name: orderer1.classicschain.com
    environment:
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:17051
    volumes:
      - ./.channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./.crypto-config/ordererOrganizations/classicschain.com/orderers/orderer1.classicschain.com/msp:/var/hyperledger/orderer/msp
      - ./.crypto-config/ordererOrganizations/classicschain.com/orderers/orderer1.classicschain.com/tls:/var/hyperledger/orderer/tls
      - orderer1.classicschain.com:/var/hyperledger/production/orderer
    ports:
      - 8050:7050
      - 18050:17051

  orderer2:
    extends:
      service: orderer-base
    container_name: orderer2.classicschain.com
    environment:
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:17052
    volumes:
      - ./.channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./.crypto-config/ordererOrganizations/classicschain.com/orderers/orderer2.classicschain.com/msp:/var/hyperledger/orderer/msp
      - ./.crypto-config/ordererOrganizations/classicschain.com/orderers/orderer2.classicschain.com/tls:/var/hyperledger/orderer/tls
      - orderer2.classicschain.com:/var/hyperledger/production/orderer
    ports:
      - 9050:7050
      - 19050:17052

  peer0.owners:
    extends:
      service: peer-base
    container_name: peer0.owners.classicschain.com
    environment:
      - CORE_PEER_ID=peer0.owners.classicschain.com
      - CORE_PEER_ADDRESS=peer0.owners.classicschain.com:7051
      - CORE_PEER_LOCALMSPID=OwnersMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.owners.classicschain.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.owners.classicschain.com:7051
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./.crypto-config/peerOrganizations/owners.classicschain.com/peers/peer0.owners.classicschain.com/msp:/etc/hyperledger/fabric/msp
      - ./.crypto-config/peerOrganizations/owners.classicschain.com/peers/peer0.owners.classicschain.com/tls:/etc/hyperledger/fabric/tls
      - peer0.owners.classicschain.com:/var/hyperledger/production
    ports:
      - 7051:7051
      - 9443:9443

  peer1.owners:
    extends:
      service: peer-base
    container_name: peer1.owners.classicschain.com
    environment:
      - CORE_PEER_ID=peer1.owners.classicschain.com
      - CORE_PEER_ADDRESS=peer1.owners.classicschain.com:7051
      - CORE_PEER_LOCALMSPID=OwnersMSP
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.owners.classicschain.com:7051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.owners.classicschain.com:7051
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./.crypto-config/peerOrganizations/owners.classicschain.com/peers/peer1.owners.classicschain.com/msp:/etc/hyperledger/fabric/msp
      - ./.crypto-config/peerOrganizations/owners.classicschain.com/peers/peer1.owners.classicschain.com/tls:/etc/hyperledger/fabric/tls
      - peer1.owners.classicschain.com:/var/hyperledger/production
    ports:
      - 8051:7051
      - 10443:9444

  peer0.workshops:
    extends:
      service: peer-base
    container_name: peer0.workshops.classicschain.com
    environment:
      - CORE_PEER_ID=peer0.workshops.classicschain.com
      - CORE_PEER_ADDRESS=peer0.workshops.classicschain.com:7051
      - CORE_PEER_LOCALMSPID=WorkshopsMSP
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.workshops.classicschain.com:7051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.workshops.classicschain.com:7051
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9445
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./.crypto-config/peerOrganizations/workshops.classicschain.com/peers/peer0.workshops.classicschain.com/msp:/etc/hyperledger/fabric/msp
      - ./.crypto-config/peerOrganizations/workshops.classicschain.com/peers/peer0.workshops.classicschain.com/tls:/etc/hyperledger/fabric/tls
      - peer0.workshops.classicschain.com:/var/hyperledger/production
    ports:
      - 9051:7051
      - 11443:9445

  peer1.workshops:
    extends:
      service: peer-base
    container_name: peer1.workshops.classicschain.com
    environment:
      - CORE_PEER_ID=peer1.workshops.classicschain.com
      - CORE_PEER_ADDRESS=peer1.workshops.classicschain.com:7051
      - CORE_PEER_LOCALMSPID=WorkshopsMSP
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.workshops.classicschain.com:7051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.workshops.classicschain.com:7051
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9446
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./.crypto-config/peerOrganizations/workshops.classicschain.com/peers/peer1.workshops.classicschain.com/msp:/etc/hyperledger/fabric/msp
      - ./.crypto-config/peerOrganizations/workshops.classicschain.com/peers/peer1.workshops.classicschain.com/tls:/etc/hyperledger/fabric/tls
      - peer1.workshops.classicschain.com:/var/hyperledger/production
    ports:
      - 10051:7051
      - 12443:9446

  peer0.certifiers:
    extends:
      service: peer-base
    container_name: peer0.certifiers.classicschain.com
    environment:
      - CORE_PEER_ID=peer0.certifiers.classicschain.com
      - CORE_PEER_ADDRESS=peer0.certifiers.classicschain.com:7051
      - CORE_PEER_LOCALMSPID=CertifiersMSP
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.certifiers.classicschain.com:7051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.certifiers.classicschain.com:7051
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9447
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./.crypto-config/peerOrganizations/certifiers.classicschain.com/peers/peer0.certifiers.classicschain.com/msp:/etc/hyperledger/fabric/msp
      - ./.crypto-config/peerOrganizations/certifiers.classicschain.com/peers/peer0.certifiers.classicschain.com/tls:/etc/hyperledger/fabric/tls
      - peer0.certifiers.classicschain.com:/var/hyperledger/production
    ports:
      - 11051:7051
      - 13443:9447

  peer1.certifiers:
    extends:
      service: peer-base
    container_name: peer1.certifiers.classicschain.com
    environment:
      - CORE_PEER_ID=peer1.certifiers.classicschain.com
      - CORE_PEER_ADDRESS=peer1.certifiers.classicschain.com:7051
      - CORE_PEER_LOCALMSPID=CertifiersMSP
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.certifiers.classicschain.com:7051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.certifiers.classicschain.com:7051
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9448
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./.crypto-config/peerOrganizations/certifiers.classicschain.com/peers/peer1.certifiers.classicschain.com/msp:/etc/hyperledger/fabric/msp
      - ./.crypto-config/peerOrganizations/certifiers.classicschain.com/peers/peer1.certifiers.classicschain.com/tls:/etc/hyperledger/fabric/tls
      - peer1.certifiers.classicschain.com:/var/hyperledger/production
    ports:
      - 12051:7051
      - 14443:9448

networks:
  fabric-network:

volumes:
  orderer0.classicschain.com:
  orderer1.classicschain.com:
  orderer2.classicschain.com:
  peer0.owners.classicschain.com:
  peer1.owners.classicschain.com:
  peer0.workshops.classicschain.com:
  peer1.workshops.classicschain.com:
  peer0.certifiers.classicschain.com:
  peer1.certifiers.classicschain.com: