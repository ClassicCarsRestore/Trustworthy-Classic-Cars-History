---
Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: ./.crypto-config/ordererOrganizations/classicschain.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
    OrdererEndpoints:
      - orderer0.classicschain.com:7050
      - orderer1.classicschain.com:7050
      - orderer2.classicschain.com:7050

  - &Owners
    Name: OwnersMSP
    ID: OwnersMSP
    MSPDir: ./.crypto-config/peerOrganizations/owners.classicschain.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OwnersMSP.admin', 'OwnersMSP.peer', 'OwnersMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('OwnersMSP.admin', 'OwnersMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('OwnersMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('OwnersMSP.peer')"
    AnchorPeers:
      - Host: peer0.owners.classicschain.com
        Port: 7051

  - &Workshops
    Name: WorkshopsMSP
    ID: WorkshopsMSP
    MSPDir: ./.crypto-config/peerOrganizations/workshops.classicschain.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('WorkshopsMSP.admin', 'WorkshopsMSP.peer', 'WorkshopsMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('WorkshopsMSP.admin', 'WorkshopsMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('WorkshopsMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('WorkshopsMSP.peer')"
    AnchorPeers:
      - Host: peer0.workshops.classicschain.com
        Port: 7051

  - &Certifiers
    Name: CertifiersMSP
    ID: CertifiersMSP
    MSPDir: ./.crypto-config/peerOrganizations/certifiers.classicschain.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('CertifiersMSP.admin', 'CertifiersMSP.peer', 'CertifiersMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('CertifiersMSP.admin', 'CertifiersMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('CertifiersMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('CertifiersMSP.peer')"
    AnchorPeers:
      - Host: peer0.certifiers.classicschain.com
        Port: 7051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_0: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  EtcdRaft:
    Consenters:
      - Host: orderer0.classicschain.com
        Port: 7050
        ClientTLSCert: ./.crypto-config/ordererOrganizations/classicschain.com/orderers/orderer0.classicschain.com/tls/server.crt
        ServerTLSCert: ./.crypto-config/ordererOrganizations/classicschain.com/orderers/orderer0.classicschain.com/tls/server.crt
      - Host: orderer1.classicschain.com
        Port: 7050
        ClientTLSCert: ./.crypto-config/ordererOrganizations/classicschain.com/orderers/orderer1.classicschain.com/tls/server.crt
        ServerTLSCert: ./.crypto-config/ordererOrganizations/classicschain.com/orderers/orderer1.classicschain.com/tls/server.crt
      - Host: orderer2.classicschain.com
        Port: 7050
        ClientTLSCert: ./.crypto-config/ordererOrganizations/classicschain.com/orderers/orderer2.classicschain.com/tls/server.crt
        ServerTLSCert: ./.crypto-config/ordererOrganizations/classicschain.com/orderers/orderer2.classicschain.com/tls/server.crt
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  ClassicsOrdererGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
    Consortiums:
      ClassicsConsortium:
        Organizations:
          - *Owners
          - *Workshops
          - *Certifiers
  ClassicsChannel:
    <<: *ChannelDefaults
    Consortium: ClassicsConsortium
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Owners
        - *Workshops
        - *Certifiers